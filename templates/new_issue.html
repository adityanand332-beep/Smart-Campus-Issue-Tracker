{% extends "base.html" %}{% block title %}Report issue{% endblock %}{% block content %}<div class="formbox"><span class="eyebrow">NEW CAMPUS REPORT</span><h1>Report an issue</h1><p class="text-secondary">Add a precise location to help the right team find it.</p><form method="post"><label class="form-label">Issue title *</label><input class="form-control" name="title" maxlength="150" required placeholder="Ceiling fan not working"><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label">Category *</label><select class="form-select" name="category" required><option value="">Choose</option>{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Priority</label><select class="form-select" name="priority">{% for p in priorities %}<option {% if p=='Medium' %}selected{% endif %}>{{p}}</option>{% endfor %}</select></div></div><label class="form-label mt-3">Exact location *</label><input class="form-control" name="location" maxlength="160" required placeholder="Academic Block, Room 204"><label class="form-label mt-3">Description *</label><textarea class="form-control" name="description" rows="5" maxlength="3000" required placeholder="What happened? Add useful details."></textarea><button class="btn btn-primary mt-4">Submit report</button></form></div>{% endblock %}
