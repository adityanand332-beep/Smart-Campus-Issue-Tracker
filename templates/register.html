{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<div class="auth cardx"><h2>Create account</h2><p class="text-secondary">Student account registration.</p><form method="post"><label class="form-label">Full name</label><input class="form-control" name="name" required maxlength="100"><label class="form-label mt-3">Email</label><input class="form-control" name="email" type="email" required><label class="form-label mt-3">Password (8+ characters)</label><input class="form-control" name="password" type="password" minlength="8" required><button class="btn btn-primary w-100 mt-4">Register</button></form><p class="mt-3 mb-0">Already registered? <a href="{{url_for('login')}}">Login</a></p></div>{% endblock %}
